<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gestion Stock Pharmacie - ENSA Fès</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 30px;
        }

        .card {
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .badge-tag {
            margin-right: 4px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Pharmacie - Stock de Produits</h2>
            <span class="badge bg-primary fs-6">TP1 - Spring Boot & Thymeleaf</span>
        </div>

        <div class="card p-4">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Prix</th>
                        <th>Code Barre</th>
                        <th>Expiration</th>
                        <th>Catégorie</th>
                        <th>Fournisseur</th>
                        <th>Fabricant</th>
                        <th>Tags</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${produits}">
                        <td th:text="${p.id}">1</td>
                        <td><strong th:text="${p.nom}">Nom</strong><br><small class="text-muted"
                                th:text="${p.description}"></small></td>
                        <td th:text="|${p.prix} DH|">0.00 DH</td>
                        <td><code th:text="${p.codeBarre}">CODE</code></td>
                        <td th:text="${p.dateExpiration}">2026-01-01</td>
                        <td><span class="badge bg-info text-dark"
                                th:text="${p.categorie != null ? p.categorie.nom : '-'}">Catégorie</span></td>
                        <td th:text="${p.fournisseur != null ? p.fournisseur.nom : '-'}">Fournisseur</td>
                        <td th:text="${p.detailProduit != null ? p.detailProduit.fabricant : '-'}">Sanofi</td>
                        <td>
                            <span th:each="t : ${p.tags}" class="badge bg-secondary badge-tag"
                                th:text="${t.libelle}">Tag</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
